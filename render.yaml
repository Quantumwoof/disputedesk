# Optional: one-click free-tier hosting on Render (https://render.com). Hosts the DEMO mode (no secrets needed).
services:
  - type: web
    name: disputedesk
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node bin/disputedesk.js demo
    healthCheckPath: /api/state
    envVars:
      - key: DISPUTEDESK_MODE
        value: demo
      # none = instant offline engine, so the first page load is fast. Set pollinations for free-LLM drafting (slower: ~3 min to triage 12 disputes).
      - key: LLM_PROVIDER
        value: none
      - key: PORT
        value: 10000
